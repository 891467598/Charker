name: Windows .NET build

on:
  push:
    branches: [main]
    paths: ["windows-dotnet/**", ".github/workflows/windows-dotnet.yml"]
  pull_request:
    paths: ["windows-dotnet/**", ".github/workflows/windows-dotnet.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-dotnet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    outputs:
      release_version: ${{ steps.package.outputs.release_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 8.0.426
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: windows-dotnet/Bridge/package-lock.json
      - name: Build self-contained application
        shell: pwsh
        run: ./windows-dotnet/build.ps1 -Output "$env:RUNNER_TEMP/ANKER"
      - name: JavaScript regression checks
        shell: pwsh
        run: node ./windows-dotnet/Tests/realtime-view.cjs
      - name: Local TLS regression checks
        shell: pwsh
        run: ./windows-dotnet/Tests/run-native.ps1 -ProgramDirectory "$env:RUNNER_TEMP/ANKER" -Tls
      - name: Package portable application and offline setup
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $program=Join-Path $env:RUNNER_TEMP 'ANKER'
          $output=Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          $prerequisites=Join-Path $env:RUNNER_TEMP 'ANKER-prerequisites'
          New-Item -ItemType Directory -Force $output,$prerequisites | Out-Null
          foreach($name in @('self-test-results.txt','tls-test-results.json')){
            $path=Join-Path $program $name
            if(Test-Path -LiteralPath $path){Move-Item -LiteralPath $path -Destination $output}
          }
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/?linkid=2124701' -OutFile (Join-Path $prerequisites 'MicrosoftEdgeWebView2RuntimeInstallerX64.exe')
          $result=Start-Process choco -ArgumentList @('install','innosetup','--yes','--no-progress') -Wait -PassThru -WindowStyle Hidden
          if($result.ExitCode -ne 0){throw 'Inno Setup install failed'}
          $iscc=@(
            (Join-Path $env:ProgramFiles 'Inno Setup 7/ISCC.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6/ISCC.exe')
          ) | Where-Object {Test-Path -LiteralPath $_} | Select-Object -First 1
          if(!$iscc){$iscc=(Get-Command ISCC.exe -ErrorAction Stop).Source}
          ./windows-dotnet/Installer/build-setup.ps1 -Iscc $iscc -PayloadDir $program -PrerequisiteDir $prerequisites -OutputDir $output
          $version=([xml](Get-Content ./windows-dotnet/ANKER.Windows.csproj -Raw)).Project.PropertyGroup.Version
          $releaseVersion=((Get-Content ./windows-dotnet/Installer/ANKER.iss | Select-String '^AppVersion=').Line -split '=',2)[1]
          "release_version=$releaseVersion" | Add-Content $env:GITHUB_OUTPUT -Encoding utf8
          Compress-Archive -LiteralPath $program -DestinationPath (Join-Path $output "ANKER-$version-windows-x64.zip")
          Get-ChildItem $output -File | Where-Object Extension -In '.exe','.zip' | ForEach-Object {
            "$( (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content (Join-Path $output 'SHA256SUMS.txt') -Encoding ascii
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ANKER-windows-x64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

